<title>MARS VIBE — AFTER MIDNIGHT</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        min-height: 100vh;
        font-family: Arial, sans-serif;
        background:
            radial-gradient(circle at 50% 20%, #252525 0%, #0b0b0b 45%, #000 100%);
        color: white;

        display: flex;
        justify-content: center;
        align-items: center;

        padding: 20px;
    }

    .container {
        width: 100%;
        max-width: 430px;
        text-align: center;
    }

    .logo {
        font-size: 30px;
        font-weight: 700;
        letter-spacing: 7px;
        margin-bottom: 25px;
    }

    .subtitle {
        color: #888;
        font-size: 12px;
        letter-spacing: 3px;
        margin-top: -18px;
        margin-bottom: 25px;
    }

    .cover {
        width: 100%;
        aspect-ratio: 1 / 1;
        border-radius: 22px;

        background:
            radial-gradient(circle at 70% 30%, #555 0%, transparent 25%),
            radial-gradient(circle at 30% 70%, #333 0%, transparent 30%),
            linear-gradient(135deg, #1d1d1d, #050505);

        box-shadow:
            0 25px 70px rgba(0, 0, 0, 0.8),
            inset 0 0 50px rgba(255,255,255,0.03);

        display: flex;
        justify-content: center;
        align-items: center;

        margin-bottom: 25px;
        overflow: hidden;
    }

    .moon {
        width: 110px;
        height: 110px;
        border-radius: 50%;

        background: #eee;

        box-shadow:
            0 0 40px rgba(255,255,255,0.25),
            0 0 100px rgba(255,255,255,0.08);
    }

    .track-title {
        font-size: 25px;
        font-weight: 600;
        margin-bottom: 8px;
    }

    .track-subtitle {
        color: #888;
        font-size: 14px;
        margin-bottom: 25px;
    }

    audio {
        width: 100%;
        height: 45px;
    }

    .bottom {
        margin-top: 25px;
        color: #555;
        font-size: 11px;
        letter-spacing: 2px;
    }

    @media (max-width: 500px) {
        .logo {
            font-size: 25px;
        }

        .track-title {
            font-size: 22px;
        }
    }
</style>
```

</head>

<body>
