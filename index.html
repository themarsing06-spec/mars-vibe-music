<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MARS VIBE — AFTER MIDNIGHT</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background: #050505;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.player {
    width: 100%;
    max-width: 430px;
    text-align: center;
}

.logo {
    font-size: 30px;
    font-weight: bold;
    letter-spacing: 7px;
    margin-bottom: 8px;
}

.subtitle {
    color: #777;
    font-size: 11px;
    letter-spacing: 4px;
    margin-bottom: 25px;
}

.cover {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 22px;
    background:
        radial-gradient(circle at 65% 35%, #777 0, #777 2%, transparent 3%),
        radial-gradient(circle at 35% 65%, #444 0, #444 2%, transparent 3%),
        radial-gradient(circle at center, #222 0%, #0b0b0b 65%, #000 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: 0 25px 70px rgba(0,0,0,.8);
    margin-bottom: 25px;
}

.moon {
    width: 105px;
    height: 105px;
    border-radius: 50%;
    background: #eee;
    box-shadow: 0 0 50px rgba(255,255,255,.25);
}

.title {
    font-size: 25px;
    font-weight: bold;
    margin-bottom: 7px;
}

.artist {
    color: #888;
    font-size: 14px;
    margin-bottom: 22px;
}

audio {
    width: 100%;
}

.footer {
    margin-top: 25px;
    color: #444;
    font-size: 10px;
    letter-spacing: 2px;
}
</style>
</head>

<body>

<div class="player">

    <div class="logo">MARS VIBE</div>

    <div class="subtitle">NIGHT MUSIC</div>

    <div class="cover">
        <div class="moon"></div>
    </div>

    <div class="title">AFTER MIDNIGHT</div>

    <div class="artist">Night Drive 🌙</div>

    <audio controls preload="metadata">
        <source src="AFTER%20MIDNIGHT%20_%20Night%20Drive%20%F0%9F%8C%99.mp3" type="audio/mpeg">
        Ваш браузер не поддерживает аудио.
    </audio>

    <div class="footer">
        MARS VIBE • 2026
    </div>

</div>

</body>
</html>
